name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node 18
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3. Install npm dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the React app (creates the /build folder)
      - name: Build React app
        run: npm run build

      # 5. Set up Java 17 (required by Gradle/Android)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 6. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 7. Accept Android SDK licenses (required for Gradle)
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 8. Sync the React build into the Android project via Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        working-directory: ${{ github.workspace }}

      # 10. Build debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      # 11. Upload the APK as a downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: timesheetick-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
